[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apix"
version = "0.1.0"
description = "APIx: Real-time Airfare Price Index for India (SIH 2026 Problem Statement 26056 - CPI Augmentation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Woventech - Team APIx", email = "apix-dev@woventech.internal" }
]
keywords = [
    "airfare",
    "price-index",
    "cpi",
    "inflation",
    "sih2026",
    "dgca",
    "playwright",
    "fastapi",
    "amadeus"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.1,<3.0.0",
    "numpy>=1.26.4,<2.0.0",
    "scipy>=1.12.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "playwright>=1.42.0,<2.0.0",
    "pytest>=8.1.1,<9.0.0",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4,<4.0.0",
    "requests>=2.31.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-asyncio>=0.23.6,<1.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "ruff>=0.3.4",
    "black>=24.2.0",
    "mypy>=1.9.0",
    "types-requests>=2.31.0.20240311",
    "pandas-stubs>=2.2.0.240218"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "scraper: Tests that involve web scraping",
    "slow: Tests with long runtimes"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP"   # pyupgrade
]
ignore = [
    "E501",  # line length handled by black/formatter
    "B008"   # do not perform function calls in argument defaults (FastAPI Depends)
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "B905"]
"scripts/*" = ["E402", "F401", "B905"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.worktrees
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
