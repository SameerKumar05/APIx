name: APIx CI / Quality Gate

on:
  push:
    branches:
      - main
      - "feat/**"
      - "cycle*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Linting & Style Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Execute Ruff Code Linting
        run: |
          ruff check .

      - name: Execute Black Code Style Verification
        run: |
          black --check .

  typecheck:
    name: Static Type Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Mypy Type Checking
        run: |
          mypy backend/app/schemas backend/app/models backend/app/services ingestion

  test-backend:
    name: Backend Test Suite & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Execute Pytest Suite with Coverage
        run: |
          pytest --cov=backend --cov=ingestion --cov-report=term-missing tests/

  test-frontend:
    name: Frontend TypeScript & Mock Contract Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: |
          bun install --frozen-lockfile

      - name: TypeScript Build & Typecheck
        run: |
          bun run build

      - name: Verify Frontend Mock Contracts
        run: |
          bun scripts/verify-mock-data.ts

      - name: Install Playwright Chromium
        run: |
          bunx playwright-core install chromium --with-deps

      - name: Verify Tooltip Contrast Gate
        run: |
          bun scripts/verify-contrast.ts

  master-verification:
    name: Master Verification Harness
    needs: [lint, test-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          bun install --frozen-lockfile

      - name: Execute Master Test Harness
        run: |
          chmod +x scripts/verify_all.sh
          ./scripts/verify_all.sh
