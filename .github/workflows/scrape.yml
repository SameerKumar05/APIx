name: Daily Airfare Scraping & Ingestion Pipeline

on:
  schedule:
    # Daily run at 02:00 UTC (07:30 IST) - calibrated off-peak airfare index capture
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Ingestion mode (live, synthetic, mock)"
        required: false
        default: "live"
        type: choice
        options:
          - live
          - synthetic
          - mock
      sources:
        description: "Single SCRAPER_SOURCE value. 'all' is accepted and mapped to multi_source."
        required: false
        default: "multi_source"
        type: choice
        options:
          - multi_source
          - all
          - easemytrip
          - makemytrip
          - spicejet
          - amadeus
          - synthetic
      force:
        description: "Run even if this UTC day already completed"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-and-ingest:
    name: Execute Scraper & Ingestion Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Chromium Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright Chromium & System Dependencies
        run: |
          playwright install --with-deps chromium

      - name: UTC day for the once-per-day marker
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore today's sweep marker
        uses: actions/cache@v4
        with:
          path: artifacts/scheduler
          key: apix-daily-sweep-${{ steps.day.outputs.day }}

      - name: Prepare Artifacts Directory
        run: |
          mkdir -p artifacts/scheduler

      - name: Run daily scheduler sweep
        env:
          INGESTION_ENDPOINT_URL: ${{ secrets.INGESTION_ENDPOINT_URL }}
          API_BASE_URL: ${{ secrets.INGESTION_ENDPOINT_URL }}
          INGESTION_API_KEY: ${{ secrets.INGESTION_API_KEY }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          INGESTION_MODE: ${{ github.event.inputs.mode || 'live' }}
          SCRAPER_SOURCE: ${{ github.event.inputs.sources || 'multi_source' }}
          SCHEDULER_CRON: "0 2 * * *"
          SCHEDULER_DISPATCH: direct
          SCHEDULER_STATE_DIR: artifacts/scheduler
          SCRAPER_SESSION_REUSE: "0"
          PLAYWRIGHT_HEADLESS: "true"
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
          FORCE_SWEEP: ${{ github.event.inputs.force || 'false' }}
        run: |
          if [ "$FORCE_SWEEP" = "true" ]; then
            rm -f artifacts/scheduler/completed-*
          fi
          python -m ingestion.scheduler --run-once --jitter-min 0 --jitter-max 0

      - name: Upload Scraper Run Summary Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-run-summary-${{ github.run_id }}
          path: |
            artifacts/
            run_summary.json
            *.json
            *.log
          if-no-files-found: warn
          retention-days: 30
